[package]
name = "grpc-low-latency-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

[[bin]]
name = "spike"
path = "src/bin/spike.rs"

[dependencies]
cryptoki = "0.12"
sha2 = "0.10"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
