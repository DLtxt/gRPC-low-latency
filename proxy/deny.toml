# cargo-deny configuration.
#
# Advisories and licences are enforced; duplicate-version warnings are not, because a
# transitive tree this size always has some and failing CI on them trains people to
# ignore the whole check.

[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
