# Authorization policy: which workload may perform which operation on which key.
#
# Default is deny. An identity absent from this file is granted nothing, and an
# identity present here is granted only what is listed -- there are no wildcards, on
# purpose. A wildcard in an authorization policy is a footgun: it silently widens as
# new keys are added, which is exactly when you would want it to stay narrow.
#
# Identities are the URI SAN of the client certificate, in SPIFFE form. They are
# issued by scripts/gen-certs.sh.

[[workloads]]
identity = "spiffe://local/ns/default/sa/payments"
description = "Payment service. Signs with both key pairs, uses the AES key, and requests transfers."
grants = [
    { key_label = "demo-ec-p256",  operations = ["sign", "verify", "get_public_key"] },
    { key_label = "demo-rsa-2048", operations = ["sign", "verify", "get_public_key"] },
    { key_label = "demo-aes-256",  operations = ["encrypt", "decrypt"] },
    # A transfer key: sign_transfer, never sign. The proxy refuses to load a policy
    # granting `sign` on a key in policy/transfers.toml.
    { key_label = "demo-transfer-key", operations = ["sign_transfer", "verify", "get_public_key"] },
]

[[workloads]]
identity = "spiffe://local/ns/default/sa/reporting"
description = "Reporting service. Read-only: verifies signatures, never produces them."
grants = [
    { key_label = "demo-ec-p256",  operations = ["verify", "get_public_key"] },
    { key_label = "demo-rsa-2048", operations = ["verify", "get_public_key"] },
]

# Deliberately under-privileged. Batch may sign with the EC key but NOT with
# demo-rsa-2048, which is what the M4 demo exercises: a real denial, with the metric
# incrementing, rather than a description of one.
[[workloads]]
identity = "spiffe://local/ns/default/sa/batch"
description = "Batch jobs. EC signing only; no access to the RSA key or the AES key."
grants = [
    { key_label = "demo-ec-p256", operations = ["sign", "verify", "get_public_key"] },
]

# Relays approvals for held transfers. It cannot approve anything itself -- an approval
# is a signature by an approver's own key, checked against certs/approvers/ -- and it
# cannot request transfers: the proxy refuses to load a policy giving one identity both
# sign_transfer and approve on the same key.
[[workloads]]
identity = "spiffe://local/ns/default/sa/treasury"
description = "Treasury console. Shows held transfers to approvers and relays their approvals."
grants = [
    { key_label = "demo-transfer-key", operations = ["approve", "get_public_key"] },
]

# The build system (M11). It can ask for a release to be signed and nothing else: the
# proxy refuses to load a policy granting `sign` on a key in policy/releases.toml, so
# a compromised CI runner cannot get an arbitrary digest signed with the release key.
[[workloads]]
identity = "spiffe://local/ns/default/sa/ci"
description = "Build system. Requests release signatures for the builds it produces."
grants = [
    { key_label = "demo-release-key", operations = ["sign_release", "get_public_key"] },
]

# Relays approvals for held releases, as treasury does for transfers. Kept apart from
# ci for the same reason: whoever requests a release cannot also be the channel its
# approvals arrive through.
[[workloads]]
identity = "spiffe://local/ns/default/sa/release-review"
description = "Release review console. Shows held releases to approvers and relays their approvals."
grants = [
    { key_label = "demo-release-key", operations = ["approve", "get_public_key"] },
]
