# gRPC-low-latency: SoftHSM2 token provisioning + the proxy that uses it.
#
# There is deliberately no "softhsm server" here. PKCS#11 is an in-process C API
# with no network protocol, so the proxy dlopen()s libsofthsm2.so itself and shares
# the token directory with the init container through a named volume (plan.md 4.1).
#
# PINs come from .env, which `make env` generates. They are not defaulted here --
# a compose file with a working PIN baked in is exactly the mistake plan.md 9 warns
# about for a project that is ostensibly about key protection.

services:
  # Creates the token and the demo keys, then exits. Idempotent.
  # The ONLY process that writes the token directory; concurrent writers corrupt it.
  softhsm-init:
    build:
      context: .
      dockerfile: docker/softhsm-init/Dockerfile
    restart: "no"
    environment:
      TOKEN_LABEL: ${TOKEN_LABEL:?TOKEN_LABEL not set -- run 'make env'}
      SO_PIN: ${SO_PIN:?SO_PIN not set -- run 'make env'}
      USER_PIN: ${USER_PIN:?USER_PIN not set -- run 'make env'}
    volumes:
      - softhsm-tokens:/var/lib/softhsm/tokens

  proxy:
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
    depends_on:
      softhsm-init:
        condition: service_completed_successfully
    environment:
      PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
      TOKEN_LABEL: ${TOKEN_LABEL:?TOKEN_LABEL not set -- run 'make env'}
      USER_PIN: ${USER_PIN:?USER_PIN not set -- run 'make env'}
      CERT_DIR: /etc/grpc-low-latency/certs
      AUTHZ_POLICY: /etc/grpc-low-latency/policy/authz.toml
      PROXY_TLS: ${PROXY_TLS:-on}
      METRICS_ADDR: 0.0.0.0:9090
    volumes:
      - softhsm-tokens:/var/lib/softhsm/tokens
      # Read-only, and generated by `make certs` -- never baked into the image and
      # never committed. A container image carrying a private key leaks it to anyone
      # who can pull the image.
      - ./certs:/etc/grpc-low-latency/certs:ro
      - ./policy:/etc/grpc-low-latency/policy:ro
    ports:
      - "${PROXY_PORT:-50051}:50051"
      - "${METRICS_PORT:-9464}:9090"
    # token-check opens the token, exercises every demo key, and exits non-zero if
    # anything is wrong -- a far more useful signal than "the port is listening".
    healthcheck:
      test: ["CMD", "/usr/local/bin/token-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  prometheus:
    image: prom/prometheus:latest
    depends_on:
      - proxy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    environment:
      # Anonymous admin access: this stack is a local demo, and a login prompt would
      # break the "docker compose up, zero clicks" criterion in plan.md M7. Do not
      # copy this into anything reachable from a network you do not control.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      # Land on the dashboard directly rather than on an empty home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/hsm-proxy.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

volumes:
  softhsm-tokens:
  prometheus-data:
  grafana-data:
